<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облік продуктів магазину</title>
    <style>
        body { font-family: sans-serif; display: flex; gap: 20px; padding: 20px; background: #f8f9fa; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; }
        h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        input, button { padding: 8px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #2ecc71; }
        #output { background: #2d3436; color: #00b894; padding: 15px; border-radius: 5px; font-family: monospace; white-space: pre-wrap; height: 400px; overflow-y: auto; }
        .flex-row { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <div class="panel">
        <h3>Керування магазином</h3>
        
        <input type="text" id="add-name" placeholder="Назва товару (напр. Спатіфілум)">
        <div class="flex-row">
            <input type="number" id="add-price" placeholder="Ціна">
            <input type="number" id="add-qty" placeholder="Кількість">
        </div>
        <button id="btn-add">Додати продукт</button>

        <hr>

        <input type="text" id="search-name" placeholder="Введіть назву для пошуку">
        <button id="btn-search">Знайти продукт</button>

        <hr>

        <div class="flex-row">
            <input type="number" id="order-id" placeholder="ID товару">
            <input type="number" id="order-qty" placeholder="Кількість для замовлення">
        </div>
        <button id="btn-order">Створити замовлення</button>
    </div>

    <div class="panel">
        <h3>Журнал операцій</h3>
        <div id="output"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend Search App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="auth-section" class="auth">
        <div class="auth__container">
            <h2 class="auth__title">Login</h2>
            <form id="auth-form" class="auth__form">
                <input type="text" id="username" class="auth__input" placeholder="Username" required>
                <input type="password" id="password" class="auth__input" placeholder="Password" required>
                <button type="submit" class="auth__btn">Log In</button>
            </form>
        </div>
    </section>

    <section id="app-section" class="app hidden">
        
        <header class="header">
            <h1 class="header__title">Friend Search</h1>
            <button id="logout-btn" class="header__logout-btn">Logout</button>
        </header>

        <main class="main">
            <aside class="sidebar">
                <div class="sidebar__group">
                    <input type="text" id="search-input" class="sidebar__search" placeholder="Search by name...">
                </div>

                <div class="sidebar__group">
                    <h3 class="sidebar__subtitle">Filter by Age</h3>
                    <input type="number" id="age-min" class="sidebar__input" placeholder="Min age">
                    <input type="number" id="age-max" class="sidebar__input" placeholder="Max age">
                </div>

                <div class="sidebar__group">
                    <h3 class="sidebar__subtitle">Filter by Gender</h3>
                    <label class="sidebar__radio-label">
                        <input type="radio" name="gender" value="male"> Male
                    </label>
                    <label class="sidebar__radio-label">
                        <input type="radio" name="gender" value="female"> Female
                    </label>
                    <label class="sidebar__radio-label">
                        <input type="radio" name="gender" value="all" checked> All
                    </label>
                </div>

                <div class="sidebar__group">
                    <h3 class="sidebar__subtitle">Sort By</h3>
                    <select id="sort-select" class="sidebar__select">
                        <option value="default">Default</option>
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="age-asc">Age (Ascending)</option>
                        <option value="age-desc">Age (Descending)</option>
                    </select>
                </div>

                <button id="reset-filters-btn" class="sidebar__reset-btn">Reset Filters</button>
            </aside>

            <div class="content">
                <div id="users-grid" class="users-grid">
                    </div>
                
                <div id="loader" class="loader hidden">Loading more friends...</div>
                
                <div id="pagination" class="pagination">
                    </div>
            </div>
        </main>

    </section>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Pair Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-container">
  <div class="tabs">
    <button class="tab-btn active" data-target="signup-tab">Signup</button>
    <button class="tab-btn" data-target="login-tab">Login</button>
  </div>

  <div id="signup-tab" class="tab-content active">
    <h2>Create an account</h2>
    <form id="signup-form" novalidate>
      
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" placeholder="Enter first name"> <div class="error-message"></div>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" placeholder="Enter last name"> <div class="error-message"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter email"> <div class="error-message"></div>
      </div>

      <div class="form-group password-group">
        <label for="signupPassword">Password</label>
        <div class="input-wrapper">
          <input type="password" id="signupPassword" name="password" placeholder="Enter password"> <span class="toggle-password">👁️</span> </div>
        <div class="error-message"></div>
      </div>

      <div class="form-group password-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password"> <span class="toggle-password">👁️</span> </div>
        <div class="error-message"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="+380..."> <div class="error-message"></div>
        </div>
        <div class="form-group">
          <label for="dateBirth">Date of Birth</label>
          <input type="date" id="dateBirth" name="dateBirth"> <div class="error-message"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender"> <option value="">Select gender...</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
        <div class="error-message"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="country">Country</label>
          <select id="country" name="country"> <option value="">Select country...</option>
            <option value="ua">Ukraine</option>
            <option value="us">United States</option>
            <option value="uk">United Kingdom</option>
          </select>
          <div class="error-message"></div>
        </div>
        <div class="form-group">
          <label for="city">City</label>
          <select id="city" name="city" disabled> <option value="">Select city...</option>
            </select>
          <div class="error-message"></div>
        </div>
      </div>

      <button type="submit" class="submit-btn">Signup</button>
    </form>
  </div>

  <div id="login-tab" class="tab-content" style="display: none;">
    <h2>Login here</h2>
    <form id="login-form" novalidate>
      
      <div class="form-group">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" name="username" placeholder="Enter username"> <div class="error-message"></div>
      </div>

      <div class="form-group password-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrapper">
          <input type="password" id="loginPassword" name="password" placeholder="Enter password"> <span class="toggle-password">👁️</span> </div>
        <div class="error-message"></div>
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="rememberMe" name="rememberMe"> <label for="rememberMe">Remember Me</label>
      </div>

      <button type="submit" class="submit-btn">Login</button>
    </form>
  </div>
</div>
    <script src="script.js"></script>

</body>
</html>
